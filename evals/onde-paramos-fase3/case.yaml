schema_version: "1.1"
name: onde-paramos-fase3
description: >-
  Fases 0, 1 e 2 fechadas com evidência; fase 3 (Projeto e ética) aberta. O Pesquisador deve reconhecer o estado real e apontar a porta da fase 3.
tags: [pesquisador, estado]
runs: 1
context:
  scaffold_script: setup.sh
execution:
  prompt: "Pesquisador, onde paramos?"
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Edit, Write]
graders:
  - type: regex
    name: cita_fase_3
    pattern: "[Ff]ase 3|Projeto e [eé]tica"
    match: contains
  - type: tool_used
    name: nao_edita
    tool: Edit
    min: 0
    max: 0
  - type: llm
    name: estado_correto
    criteria: |
      A resposta deve dizer que a fase atual é a 3 (Projeto e ética) e que as fases 0, 1 e 2 constam como fechadas no PROGRESSO.md; deve citar a porta da fase 3 (projeto conforme a NBR 15287:2025 e parecer do CEP quando houver pessoas) e mencionar pelo menos uma das decisões registradas (bases de busca, revisão sem metanálise) ou a pergunta já definida. É aceitável — e bom — que aponte itens marcados com evidência insuficiente ou contradições entre os arquivos (por exemplo, cronograma do modelo não ajustado); isso NÃO conta como dizer que a fase 1 ou 2 está aberta. Falha apenas se: afirmar que a fase atual é outra que não a 3; ignorar por completo as decisões e a pergunta registradas; ou marcar/declarar a fase 3 como concluída.
