schema_version: "1.1"
name: onde-paramos-fase0
description: >-
  Projeto recém-criado, fase 0 aberta. O Pesquisador deve dizer que está na fase 0, o que falta para fechá-la e fazer uma pergunta do diagnóstico — sem marcar nada.
tags: [pesquisador, estado]
runs: 1
context:
  scaffold_script: setup.sh
execution:
  prompt: "Pesquisador, onde paramos?"
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Edit, Write]
graders:
  - type: regex
    name: cita_fase_0
    pattern: "[Ff]ase 0|[Dd]iagn[oó]stico"
    match: contains
  - type: tool_used
    name: nao_edita
    tool: Edit
    min: 0
    max: 0
  - type: tool_used
    name: nao_escreve
    tool: Write
    min: 0
    max: 0
  - type: llm
    name: resposta_de_estado
    criteria: |
      A resposta (em português) deve: (1) dizer que o projeto está na fase 0 (Diagnóstico) e que nenhuma fase está fechada; (2) listar o que falta para fechar a fase 0 — pelo menos orientador e ferramentas (Zotero, Gemini Notebook, editor); (3) terminar com uma pergunta concreta ao aluno (por exemplo, quem é o orientador). Não pode afirmar que alguma fase ou item está concluído, nem inventar decisões que não estão em DECISOES.md. Falha se a resposta marcar algo como feito ou se não fizer pergunta alguma.
