schema_version: "1.1"
name: bibliotecario-api-local
description: >-
  Sem Zotero disponível. O Bibliotecário deve explicar como ligar a API local e como conferir, sem inventar coleções.
tags: [bibliotecario]
runs: 1
context:
  scaffold_script: setup.sh
execution:
  prompt: "Bibliotecário, o conector do Zotero aparece desconectado. O que eu faço e como você confere que está funcionando?"
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - type: regex
    name: api_local
    pattern: "Avan[çc]ado|API local"
    flags: i
    match: contains
  - type: llm
    name: orienta_sem_inventar
    criteria: |
      A resposta deve: dizer para abrir o Zotero (7 ou superior) e ligar em Configurações → Avançado a opção de permitir que outros aplicativos se comuniquem com o Zotero (API local, porta 23119); citar as outras causas comuns (Zotero fechado, uv ausente); e dizer que a conferência se faz pela ferramenta status do conector, que informa quantos itens e coleções há. Não pode listar coleções ou itens inventados. Falha se afirmar que já conferiu a biblioteca ou se citar nomes de coleções.
